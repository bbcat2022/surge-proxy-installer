name: Release proxy-installer

on:
  push:
    tags:
      - 'proxy-installer-v*'
  pull_request:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public publication scope
        run: python tools/publication_guard.py --root .. --mode tracked
      - name: Install test dependency
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -q
      - name: Build release assets
        run: bash packaging/release.sh dist
      - name: Verify release archive
        run: bash packaging/smoke.sh dist/proxy-installer-local.tar.gz
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            proxy-installer/dist/proxy-installer-local.tar.gz
            proxy-installer/dist/proxy-installer-local.tar.gz.sha256
          generate_release_notes: true
